[bar/top]
monitor = ${env:MONITOR:eDP-1}
width = 1920
height = 32
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true

background = ${colors.colorbg}
foreground = ${colors.colorfg}

border-size = 0
border-color = ${colors.color1}

padding-left = 0
padding-right = 0

module-margin-left = 0
module-margin-right = 0

font-0 = JetBrains Mono:size=9;3
font-1 = Symbols Nerd Font Mono:size=9;2

modules-left = appmenu i3 xwindow player
modules-center = date
modules-right = wlan battery volume xkeyboard bluetooth logout

wm-restack = i3

override-redirect = false

scroll-up = "#i3.prev"
scroll-down = "#i3.next"

cursor-click = pointer
cursor-scroll = ns-resize

[bar/top-1]
inherit = bar/top
monitor = HDMI-1
