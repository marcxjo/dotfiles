; vim:ft=dosini

;
; Left
;

[module/appmenu]
type = custom/text

format = <label>
format-padding = 1
format-foreground = ${colors.color4}

label = 

click-left = rofi -show drun

[module/logout]
type = custom/text

format = <label>
format-padding = 1
format-foreground = ${colors.color1}

label = 

click-left = rofi -show p -modi p:'rofi-power-menu'

[module/xwindow]
type = internal/xwindow

format = <label>
format-prefix = 
format-prefix-padding = 1
format-prefix-foreground = ${colors.color5}

label = %title:0:32:…%

format-padding = 1

[module/bspwm]
type = internal/bspwm

ws-icon-default = 

label-focused = 
label-focused-foreground = ${colors.color6}
label-focused-padding = 1

label-occupied = 
label-occupied-foreground = ${colors.color6}
label-occupied-padding = 1

label-urgent = %icon%
label-urgent-foreground = ${colors.color1}
label-urgent-padding = 1

label-empty = %icon%
label-empty-foreground = ${colors.colorfg}
label-empty-padding = 1

format-padding = 0

[module/i3]
type = internal/i3

pin-workspaces = true
strip-wsnumbers = true
index-sort = true

ws-icon-default = 

label-focused = 
label-focused-foreground = ${colors.color6}
label-focused-padding = 1

label-unfocused = 
label-unfocused-foreground = ${colors.color6}
label-unfocused-padding = 1

label-urgent = %icon%
label-urgent-foreground = ${colors.color1}
label-urgent-padding = 1

format-padding = 0

;
; Middle
;

[module/date]
type = internal/date

interval = 5

date = %a %b %d

time = %H:%M %Z

format-prefix = 󰸗
format-prefix-padding = 1
format-prefix-foreground = ${colors.color12}

label = %date% | %time%

format-padding = 1

;
; Right
;

[module/player]
type=custom/script

format-prefix = 󰝚
format-prefix-padding = 1
format-prefix-foreground = ${colors.color3}

exec = ~/.config/polybar/scripts/player-mpris-tail.py --icon-playing 󰐊 --icon-paused 󰏤 --icon-stopped 󰓛 -f '%{A1:~/.config/polybar/scripts/player-mpris-tail.py previous:}󰑟%{A} %{A1:~/.config/polybar/scripts/player-mpris-tail.py play-pause:}{icon-reversed}%{A} %{A1:~/.config/polybar/scripts/player-mpris-tail.py next:}󰈑%{A} [{position} / {fmt-length}] {:artist:t16:{artist}:}{:artist: - :}{:t16:{title}:}'

format-padding = 1

tail = true

[module/battery]
type = internal/battery

full-at = 100
low-at = 10
battery = BAT0
adapter = AC
poll-interval = 0

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
format-low = <label-low>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%

format-charging-prefix = 󱐋
format-charging-prefix-padding = 1
format-charging-prefix-foreground = ${colors.color2}
format-discharging-prefix = 󱐋
format-discharging-prefix-padding = 1
format-discharging-prefix-foreground = ${colors.color3}
format-full-prefix = 󱐋
format-full-prefix-padding = 1
format-full-prefix-foreground = ${colors.color2}
format-low-prefix = 󱐋
format-low-prefix-padding = 1
format-low-prefix-foreground = ${colors.color1}

format-padding = 1

[module/volume]
type = internal/pulseaudio

format-volume = <label-volume>
format-volume-prefix = 
format-volume-prefix-padding = 1
format-volume-prefix-foreground = ${colors.color3}

format-volume-padding = 1

label-volume = %percentage%%

format-muted = <label-muted>
format-muted-prefix = 
format-muted-prefix-padding = 1
format-muted-prefix-foreground = ${colors.color11}

format-muted-padding = 1

label-muted = off

[module/xkeyboard]
type = internal/xkeyboard

indicator-icon-0 = caps lock; cap; cap
indicator-icon-1 = num lock; num; num

label-indicator-on = %icon%

label-indicator-off = %icon%

format-prefix = 󰌌
format-prefix-padding = 1
format-prefix-foreground = ${colors.color4}

format = <label-layout><label-indicator>

label-layout = %layout%

format-padding = 1
format-spacing = 2

[module/wlan]
type = internal/network

interface = ${env:IFACE_WLAN:wlan0}
interval = 5

format-connected = <label-connected>
label-connected = %ifname% | %essid% | %local_ip% | %upspeed%  %downspeed% 
format-connected-prefix = 
format-connected-prefix-padding = 1
format-connected-prefix-foreground = ${colors.color4}

format-connected-padding = 1

format-disconnected = <label-disconnected>
format-disconnected-prefix = 
format-disconnected-prefix-padding = 1
format-disconnected-prefix-foreground = ${colors.color7}

format-disconnected-padding = 1

;
; Modules currently not in use
;

[module/backlight]
type = internal/backlight
card = intel_backlight
use_actual_brightness = false
enable-scroll = true

format-prefix = LIGHT
format-prefix-padding = 1
format-prefix-foreground = ${colors.color2}

format = <label>%
label = %percentage%

format-padding = 1

[module/weather]
type = custom/script

interval = 3600

format = <label>
format-prefix = WX
format-prefix-padding = 1
format-prefix-foreground = ${colors.color9}

exec = ~/.config/polybar/scripts/openweathermap-detailed.sh

format-padding = 1

[module/cpu]
type = internal/cpu

interval = 2

format-prefix = 
format-prefix-padding = 1
format-prefix-foreground = ${colors.color13}

label = %percentage%

format = <label>%
format-padding = 1

[module/memory]
type = internal/memory

interval = 2

format-prefix = 
format-prefix-padding = 1
format-prefix-foreground = ${colors.color3}

label = %percentage_used%

format = <label>%
format-padding = 1

[module/bluetooth]
type = custom/script

format-prefix = 
format-prefix-padding = 1
format-prefix-foreground = ${colors.color4}

format-padding = 1

exec = ~/.config/polybar/scripts/system-bluetooth-bluetoothctl.sh
click-left = ~/.config/polybar/scripts/system-bluetooth-bluetoothctl.sh --toggle &

tail = true

;
; Bookends
;
[module/bookend-left-ramp]
type = custom/text

format = <label>
format-foreground = ${colors.color8}
label = 

[module/bookend-right-ramp]
type = custom/text

format = <label>
format-foreground = ${colors.color8}
label = 
